services:
  kafka:
    image: apache/kafka:4.3.1
    ports:
      - "9092:9092"
  redis:
    image: redis
    ports:
      - "6379:6379"

  rabbitmq:
    image: rabbitmq:4.3.6-management
    ports:
      - "5672:5672"
      - "15672:15672"
  
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: alert_db
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:



